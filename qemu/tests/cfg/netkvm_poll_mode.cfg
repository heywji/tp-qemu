- netkvm_poll_mode:
    type = netkvm_poll_mode
    clone = yes
    mq = on
    # this case only tested on prewhql255 or higher version
    required_virtio_win_prewhql = [0.1.255, )
    # boot with virtio-net-pci device
    only Windows
    only virtio_net
    enable_rss = '"*RSS" 1'
    setup_rss_queues = '"*NumRssQueues" %s'
    check_rss_queues = "*NumRssQueues"
    check_poll_mode = "*NdisPoll"
    keyword = "ParaNdis_Finishinitialization[ParaNdis_FinishInitialization] Poll mode tried and"
    variants:
        - queue4_smp4:
            smp = 4
            queues = ${smp}
            variants:
                - rss_16:
                    rss_queues = 16
                - rss_2:
                    rss_queues = 2
        - queue4_smp2:
            smp = 2
            queues = 4
        - queue32_smp20:
            smp = 20
            queues = 32
