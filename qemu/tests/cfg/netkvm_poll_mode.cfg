- netkvm_poll_mode:
    type = netkvm_poll_mode
    only Windows
    clone = yes
    # this case only tested on prewhql255 or higher version
    # boot with virtio-net-pci device
    enable_rss = '"*RSS" 1'
    setup_rss_queues = '"*NumRssQueues" %s'
    check_rss_queues = "*NumRssQueues"
    check_poll_mode = "*NdisPoll"
    install_wdk = "wdksetup.exe /q"
    traceview_path = "C:\Program Files (x86)\Windows Kits\10\Tools\10.0.22621.0\x64\traceview.exe"
    mq = on
    Win11:
        setup_debug_level = '"DebugLevel" 5'
    variants:
        - queue4_smp4:
            smp = 4
            queues = ${smp}
            variants:
                - rss_16:
                    rss_queues = 16
                - rss_2:
                    rss_queues = 2
        - queue4_smp2:
            smp = 2
            queues = 4
        - queue32_smp20:
            smp = 20
            queues = 32
